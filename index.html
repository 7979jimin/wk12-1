<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zoo English Picture Book</title>
  <style>
    :root {
      --bg: #fdf6ec;
      --book-bg: #ffffff;
      --ink: #2d2a32;
      --muted: #6e6a75;
      --primary: #ff7a59;
      --primary-dark: #e66140;
      --secondary: #4a90e2;
      --accent: #ffd166;
      --word-bg: #fff5e6;
      --word-hover: #ffe0b2;
      --word-active: #ff7a59;
      --border: #efe4d4;
      --shadow: 0 14px 36px rgba(92, 67, 39, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at top, #fffaf2 0%, var(--bg) 100%);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 36px;
    }

    .app-header {
      width: 100%;
      max-width: 920px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .title-badge {
      background: var(--accent);
      color: #5c4310;
      font-weight: 800;
      font-size: 0.85rem;
      padding: 5px 11px;
      border-radius: 999px;
    }

    .app-title {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button, .file-btn {
      font-family: inherit;
      border: none;
      cursor: pointer;
      border-radius: 12px;
      font-weight: 700;
      transition: transform 0.12s ease, background 0.18s ease, box-shadow 0.18s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    button:active, .file-btn:active {
      transform: scale(0.97);
    }

    .btn-ghost {
      background: #ffffff;
      color: var(--ink);
      border: 1.5px solid var(--border);
      padding: 8px 13px;
      font-size: 0.88rem;
    }

    .btn-ghost:hover {
      background: #fff7ea;
      border-color: #e4cfa9;
    }

    .book-container {
      width: 100%;
      max-width: 920px;
      background: var(--book-bg);
      border-radius: 26px;
      box-shadow: var(--shadow);
      border: 2px solid var(--border);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .stage {
      position: relative;
      background: #faf3e8;
      width: 100%;
      aspect-ratio: 16 / 10;
      max-height: 500px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 18px;
    }

    .page-image {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      opacity: 0;
      transform: scale(0.985);
      transition: opacity 0.28s ease, transform 0.28s ease;
    }

    .page-image.loaded {
      opacity: 1;
      transform: scale(1);
    }

    .missing-box {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 28px;
      color: var(--muted);
      gap: 10px;
      max-width: 460px;
    }

    .missing-box.show {
      display: flex;
    }

    .missing-icon {
      font-size: 2.6rem;
    }

    .missing-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--ink);
    }

    .missing-desc {
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .nav-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.94);
      color: var(--ink);
      font-size: 1.45rem;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.14);
      z-index: 5;
    }

    .nav-arrow:hover:not(:disabled) {
      background: var(--primary);
      color: #ffffff;
    }

    .nav-arrow:disabled {
      opacity: 0.32;
      cursor: not-allowed;
    }

    .nav-prev { left: 14px; }
    .nav-next { right: 14px; }

    .page-badge {
      position: absolute;
      top: 14px;
      right: 16px;
      background: rgba(45, 42, 50, 0.72);
      color: #ffffff;
      font-size: 0.82rem;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 999px;
      backdrop-filter: blur(4px);
    }

    .story-panel {
      padding: 24px 26px 20px;
      border-top: 1.5px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .story-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .page-dots {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .dot {
      width: 11px;
      height: 11px;
      border-radius: 999px;
      background: #e2d6c4;
      border: none;
      padding: 0;
      cursor: pointer;
      transition: width 0.2s ease, background 0.2s ease;
    }

    .dot.active {
      width: 28px;
      background: var(--primary);
    }

    .story-tools {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-read-aloud {
      background: var(--secondary);
      color: #ffffff;
      padding: 8px 14px;
      font-size: 0.88rem;
    }

    .btn-read-aloud:hover {
      background: #357abd;
    }

    .reading-hint {
      font-size: 0.84rem;
      color: var(--muted);
      font-weight: 600;
    }

    .english-text {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 10px;
      align-items: center;
      font-family: "Comic Sans MS", "Chalkboard SE", "Nunito", "Arial Rounded MT Bold", sans-serif;
      font-size: 1.85rem;
      line-height: 1.5;
      color: var(--ink);
      font-weight: 700;
      padding: 6px 0;
    }

    .word-chip {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 14px;
      background: var(--word-bg);
      border: 2px solid transparent;
      cursor: pointer;
      user-select: none;
      transition: transform 0.12s ease, background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }

    .word-chip:hover {
      background: var(--word-hover);
      transform: translateY(-2px);
    }

    .word-chip.speaking {
      background: var(--word-active);
      color: #ffffff;
      border-color: #d95534;
      transform: scale(1.06);
    }

    .korean-text {
      font-size: 1.05rem;
      line-height: 1.55;
      color: var(--muted);
      background: #faf6ef;
      padding: 12px 16px;
      border-radius: 12px;
      border-left: 4px solid var(--accent);
      display: none;
    }

    .korean-text.show {
      display: block;
    }

    .audio-bar {
      background: #fff8ee;
      border-top: 1.5px solid var(--border);
      padding: 16px 26px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .btn-play {
      background: var(--primary);
      color: #ffffff;
      padding: 11px 20px;
      font-size: 0.96rem;
      min-width: 132px;
      box-shadow: 0 4px 12px rgba(255, 122, 89, 0.3);
    }

    .btn-play:hover:not(:disabled) {
      background: var(--primary-dark);
    }

    .btn-play:disabled {
      background: #d8cfc3;
      box-shadow: none;
      cursor: not-allowed;
    }

    .progress-wrap {
      flex: 1;
      min-width: 180px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--muted);
      font-weight: 600;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .speed-group {
      display: flex;
      background: #ffffff;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 3px;
      gap: 3px;
    }

    .speed-btn {
      background: transparent;
      color: var(--muted);
      padding: 6px 10px;
      font-size: 0.8rem;
      border-radius: 8px;
    }

    .speed-btn.active {
      background: var(--secondary);
      color: #ffffff;
    }

    .status-bar {
      width: 100%;
      max-width: 920px;
      margin-top: 14px;
      background: #ffffff;
      border: 1.5px solid var(--border);
      border-radius: 16px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 0.84rem;
      color: var(--muted);
    }

    .asset-chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .chip {
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.78rem;
      background: #f1ede6;
      color: var(--muted);
    }

    .chip.ok {
      background: #e6f6ec;
      color: #1f7a43;
    }

    .chip.fail {
      background: #fdecec;
      color: #c0392b;
    }

    /* Story Edit Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(25, 22, 30, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      background: #ffffff;
      width: 100%;
      max-width: 560px;
      border-radius: 22px;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.22);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .modal h2 {
      font-size: 1.15rem;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field-group label {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--muted);
    }

    .field-group textarea {
      width: 100%;
      min-height: 70px;
      padding: 10px 12px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-family: inherit;
      font-size: 0.95rem;
      resize: vertical;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 4px;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
      padding: 9px 18px;
      font-size: 0.9rem;
    }

    @media (max-width: 640px) {
      .english-text {
        font-size: 1.4rem;
        gap: 6px;
      }
      .story-panel, .audio-bar {
        padding: 16px;
      }
      .nav-arrow {
        width: 40px;
        height: 40px;
        font-size: 1.15rem;
      }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="title-group">
      <span class="title-badge">ZOO STORYBOOK</span>
      <h1 class="app-title">Welcome to the Zoo</h1>
    </div>
    <div class="header-actions">
      <button type="button" class="btn-ghost" id="editStoryBtn">문장 수정</button>
      <label class="btn-ghost file-btn" for="folderPicker">assets 폴더 직접 선택</label>
      <input type="file" id="folderPicker" webkitdirectory directory multiple hidden />
    </div>
  </header>

  <main class="book-container">
    <section class="stage" id="bookStage">
      <button type="button" class="nav-arrow nav-prev" id="prevBtn" aria-label="이전 페이지">‹</button>
      <img id="pageImage" class="page-image" alt="그림책 삽화" />
      <div class="missing-box" id="missingBox">
        <div class="missing-icon">🖼️</div>
        <div class="missing-title" id="missingTitle">이미지를 찾는 중...</div>
        <div class="missing-desc" id="missingDesc">
          이 <code>index.html</code> 파일이 바탕화면(<code>assets</code> 폴더와 같은 위치)에 있는지 확인하거나,
          오른쪽 위 <strong>assets 폴더 직접 선택</strong> 버튼을 눌러 폴더를 지정해 주세요.
        </div>
      </div>
      <div class="page-badge" id="pageBadge">Page 1 / 2</div>
      <button type="button" class="nav-arrow nav-next" id="nextBtn" aria-label="다음 페이지">›</button>
    </section>

    <section class="story-panel">
      <div class="story-top">
        <div class="page-dots" id="pageDots"></div>
        <div class="story-tools">
          <button type="button" class="btn-read-aloud" id="ttsBtn">🔊 문장 따라 읽기</button>
          <button type="button" class="btn-ghost" id="toggleKoBtn">한글 해석 보기</button>
        </div>
      </div>
      <div class="reading-hint">단어를 누르면 소리가 나요! 큰 소리로 따라 읽어 보세요.</div>
      <div class="english-text" id="englishText" aria-live="polite"></div>
      <p class="korean-text" id="koreanText"></p>
    </section>

    <section class="audio-bar">
      <button type="button" class="btn-play" id="playBtn" disabled>▶ 음성 듣기</button>
      <button type="button" class="btn-ghost" id="replayBtn" disabled>↺ 처음부터</button>
      <div class="progress-wrap">
        <div class="progress-meta">
          <span id="audioLabel">sound_01 탐색 중...</span>
          <span id="timeLabel">0:00 / 0:00</span>
        </div>
        <input type="range" id="seekBar" min="0" max="100" value="0" step="0.1" disabled />
      </div>
      <div class="speed-group" aria-label="재생 속도">
        <button type="button" class="speed-btn" data-rate="0.75">0.75x</button>
        <button type="button" class="speed-btn active" data-rate="1">1.0x</button>
        <button type="button" class="speed-btn" data-rate="1.25">1.25x</button>
      </div>
    </section>
  </main>

  <footer class="status-bar">
    <div class="asset-chips">
      <span class="chip" id="chip-picture_01">picture_01: 확인 중</span>
      <span class="chip" id="chip-picture_02">picture_02: 확인 중</span>
      <span class="chip" id="chip-sound_01">sound_01: 확인 중</span>
    </div>
    <span id="statusHint">자동 탐색 경로: ./assets/</span>
  </footer>

  <!-- 문장 수정 모달 -->
  <div class="modal-backdrop" id="editModal">
    <div class="modal">
      <h2>그림책 문장 수정</h2>
      <div class="field-group">
        <label for="editEn1">Page 1 영어 문장 (picture_01)</label>
        <textarea id="editEn1"></textarea>
      </div>
      <div class="field-group">
        <label for="editKo1">Page 1 한글 해석</label>
        <textarea id="editKo1"></textarea>
      </div>
      <div class="field-group">
        <label for="editEn2">Page 2 영어 문장 (picture_02)</label>
        <textarea id="editEn2"></textarea>
      </div>
      <div class="field-group">
        <label for="editKo2">Page 2 한글 해석</label>
        <textarea id="editKo2"></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-ghost" id="closeModalBtn">취소</button>
        <button type="button" class="btn-primary" id="saveStoryBtn">저장하기</button>
      </div>
    </div>
  </div>

  <script>
    (() => {
      const STORAGE_KEY = "english_picture_book_zoo_v2";
      const IMAGE_EXTS = [".png", ".jpg", ".jpeg", ".webp", ".gif", ".PNG", ".JPG", ".JPEG"];
      const AUDIO_EXTS = [".mp3", ".wav", ".m4a", ".ogg", ".MP3", ".WAV", ".M4A"];

      const defaultPages = [
        {
          imageKey: "picture_01",
          en: "Welcome to the zoo. People are watching the monkeys.",
          ko: "동물원에 오신 것을 환영해요. 사람들이 원숭이들을 보고 있어요."
        },
        {
          imageKey: "picture_02",
          en: "Now we see the tigers.",
          ko: "이제 우리는 호랑이들을 봐요."
        }
      ];

      let pages = loadStory();
      let currentPage = 0;
      let showKorean = false;
      let currentRate = 1;
      const assets = {
        picture_01: { url: null, filename: null },
        picture_02: { url: null, filename: null },
        sound_01: { url: null, filename: null }
      };

      const audio = new Audio();
      audio.preload = "metadata";

      // DOM elements
      const pageImage = document.getElementById("pageImage");
      const missingBox = document.getElementById("missingBox");
      const missingTitle = document.getElementById("missingTitle");
      const pageBadge = document.getElementById("pageBadge");
      const pageDots = document.getElementById("pageDots");
      const englishText = document.getElementById("englishText");
      const koreanText = document.getElementById("koreanText");
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");
      const toggleKoBtn = document.getElementById("toggleKoBtn");
      const ttsBtn = document.getElementById("ttsBtn");
      const playBtn = document.getElementById("playBtn");
      const replayBtn = document.getElementById("replayBtn");
      const seekBar = document.getElementById("seekBar");
      const audioLabel = document.getElementById("audioLabel");
      const timeLabel = document.getElementById("timeLabel");
      const speedBtns = document.querySelectorAll(".speed-btn");
      const folderPicker = document.getElementById("folderPicker");
      const statusHint = document.getElementById("statusHint");
      const bookStage = document.getElementById("bookStage");

      // Modal elements
      const editModal = document.getElementById("editModal");
      const editStoryBtn = document.getElementById("editStoryBtn");
      const closeModalBtn = document.getElementById("closeModalBtn");
      const saveStoryBtn = document.getElementById("saveStoryBtn");
      const editEn1 = document.getElementById("editEn1");
      const editKo1 = document.getElementById("editKo1");
      const editEn2 = document.getElementById("editEn2");
      const editKo2 = document.getElementById("editKo2");

      function loadStory() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
          if (Array.isArray(saved) && saved.length === 2) {
            return saved;
          }
        } catch (_) {}
        return JSON.parse(JSON.stringify(defaultPages));
      }

      function saveStory() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(pages));
      }

      function formatTime(sec) {
        if (!Number.isFinite(sec) || sec < 0) return "0:00";
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60);
        return `${m}:${String(s).padStart(2, "0")}`;
      }

      function setChip(key, ok, label) {
        const chip = document.getElementById(`chip-${key}`);
        if (!chip) return;
        chip.className = `chip ${ok ? "ok" : "fail"}`;
        chip.textContent = label;
      }

      function probeImage(baseName) {
        return new Promise((resolve) => {
          let index = 0;
          function tryNext() {
            if (index >= IMAGE_EXTS.length) {
              resolve(null);
              return;
            }
            const ext = IMAGE_EXTS[index++];
            const candidate = `./assets/${baseName}${ext}`;
            const img = new Image();
            img.onload = () => resolve({ url: candidate, filename: `${baseName}${ext}` });
            img.onerror = tryNext;
            img.src = candidate;
          }
          tryNext();
        });
      }

      function probeAudio(baseName) {
        return new Promise((resolve) => {
          let index = 0;
          function tryNext() {
            if (index >= AUDIO_EXTS.length) {
              resolve(null);
              return;
            }
            const ext = AUDIO_EXTS[index++];
            const candidate = `./assets/${baseName}${ext}`;
            const testAudio = new Audio();
            let settled = false;

            const cleanup = () => {
              testAudio.onloadedmetadata = null;
              testAudio.oncanplay = null;
              testAudio.onerror = null;
            };

            const succeed = () => {
              if (settled) return;
              settled = true;
              cleanup();
              resolve({ url: candidate, filename: `${baseName}${ext}` });
            };

            const fail = () => {
              if (settled) return;
              settled = true;
              cleanup();
              tryNext();
            };

            testAudio.preload = "metadata";
            testAudio.onloadedmetadata = succeed;
            testAudio.oncanplay = succeed;
            testAudio.onerror = fail;
            testAudio.src = candidate;
            testAudio.load();
          }
          tryNext();
        });
      }

      async function autoDiscoverAssets() {
        const [pic1, pic2, snd1] = await Promise.all([
          probeImage("picture_01"),
          probeImage("picture_02"),
          probeAudio("sound_01")
        ]);

        applyAsset("picture_01", pic1);
        applyAsset("picture_02", pic2);
        applyAsset("sound_01", snd1);

        renderPage();
      }

      function applyAsset(key, found) {
        if (found) {
          assets[key] = found;
          setChip(key, true, `${found.filename} 연결됨`);
          if (key === "sound_01") {
            setupAudio(found.url, found.filename);
          }
        } else {
          assets[key] = { url: null, filename: null };
          setChip(key, false, `${key} 없음`);
          if (key === "sound_01") {
            playBtn.disabled = true;
            replayBtn.disabled = true;
            seekBar.disabled = true;
            audioLabel.textContent = "assets/sound_01 파일을 찾지 못했습니다";
          }
        }
      }

      function setupAudio(url, filename) {
        audio.pause();
        audio.src = url;
        audio.playbackRate = currentRate;
        audio.load();
        playBtn.disabled = false;
        replayBtn.disabled = false;
        seekBar.disabled = false;
        playBtn.textContent = "▶ 음성 듣기";
        audioLabel.textContent = `오디오: ${filename}`;
        seekBar.value = 0;
        timeLabel.textContent = "0:00 / 0:00";
      }

      function clearWordHighlights() {
        englishText.querySelectorAll(".word-chip.speaking").forEach((el) => {
          el.classList.remove("speaking");
        });
      }

      function speakSingleWord(word, chipEl) {
        if (!("speechSynthesis" in window)) return;
        window.speechSynthesis.cancel();
        clearWordHighlights();

        const cleanWord = word.replace(/[^a-zA-Z0-9'-]/g, "");
        if (!cleanWord) return;

        const utter = new SpeechSynthesisUtterance(cleanWord);
        utter.lang = "en-US";
        utter.rate = Math.max(0.75, currentRate * 0.85);
        chipEl.classList.add("speaking");

        utter.onend = () => chipEl.classList.remove("speaking");
        utter.onerror = () => chipEl.classList.remove("speaking");
        window.speechSynthesis.speak(utter);
      }

      function speakFullSentence() {
        if (!("speechSynthesis" in window)) {
          alert("이 브라우저는 음성 읽기(TTS)를 지원하지 않습니다.");
          return;
        }
        window.speechSynthesis.cancel();
        clearWordHighlights();

        const text = pages[currentPage].en;
        const chips = Array.from(englishText.querySelectorAll(".word-chip"));

        // Map each word chip's character range in the sentence for highlight sync
        const ranges = [];
        let cursor = 0;
        chips.forEach((chip) => {
          const w = chip.textContent;
          const idx = text.indexOf(w, cursor);
          if (idx !== -1) {
            ranges.push({ start: idx, end: idx + w.length, el: chip });
            cursor = idx + w.length;
          }
        });

        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = "en-US";
        utter.rate = Math.max(0.7, currentRate * 0.85);

        utter.onboundary = (event) => {
          if (typeof event.charIndex !== "number") return;
          const match = ranges.find((r) => event.charIndex >= r.start && event.charIndex < r.end);
          if (match) {
            clearWordHighlights();
            match.el.classList.add("speaking");
          }
        };

        utter.onend = clearWordHighlights;
        utter.onerror = clearWordHighlights;
        window.speechSynthesis.speak(utter);
      }

      function renderEnglishWords(sentence) {
        englishText.innerHTML = "";
        const words = sentence.trim().split(/\s+/).filter(Boolean);
        words.forEach((word) => {
          const span = document.createElement("span");
          span.className = "word-chip";
          span.textContent = word;
          span.setAttribute("role", "button");
          span.setAttribute("tabindex", "0");
          span.setAttribute("aria-label", `${word} 발음 듣기`);
          span.addEventListener("click", () => speakSingleWord(word, span));
          span.addEventListener("keydown", (e) => {
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              speakSingleWord(word, span);
            }
          });
          englishText.appendChild(span);
        });
      }

      function renderDots() {
        pageDots.innerHTML = "";
        pages.forEach((_, idx) => {
          const dot = document.createElement("button");
          dot.type = "button";
          dot.className = `dot ${idx === currentPage ? "active" : ""}`;
          dot.setAttribute("aria-label", `Page ${idx + 1}`);
          dot.addEventListener("click", () => {
            if ("speechSynthesis" in window) window.speechSynthesis.cancel();
            currentPage = idx;
            renderPage();
          });
          pageDots.appendChild(dot);
        });
      }

      function renderPage() {
        const page = pages[currentPage];
        const imgAsset = assets[page.imageKey];

        pageBadge.textContent = `Page ${currentPage + 1} / ${pages.length}`;
        prevBtn.disabled = currentPage === 0;
        nextBtn.disabled = currentPage === pages.length - 1;

        renderEnglishWords(page.en);
        koreanText.textContent = page.ko;
        koreanText.classList.toggle("show", showKorean);
        toggleKoBtn.textContent = showKorean ? "한글 해석 숨기기" : "한글 해석 보기";

        renderDots();

        if (imgAsset && imgAsset.url) {
          missingBox.classList.remove("show");
          pageImage.style.display = "block";
          pageImage.classList.remove("loaded");
          pageImage.onload = () => pageImage.classList.add("loaded");
          pageImage.src = imgAsset.url;
          pageImage.alt = `${page.imageKey} 그림책 이미지`;
        } else {
          pageImage.style.display = "none";
          missingTitle.textContent = `assets 폴더에서 ${page.imageKey} 이미지를 찾지 못했습니다`;
          missingBox.classList.add("show");
        }
      }

      function goToPage(index) {
        if (index < 0 || index >= pages.length) return;
        if ("speechSynthesis" in window) window.speechSynthesis.cancel();
        currentPage = index;
        renderPage();
      }

      // Navigation
      prevBtn.addEventListener("click", () => goToPage(currentPage - 1));
      nextBtn.addEventListener("click", () => goToPage(currentPage + 1));

      document.addEventListener("keydown", (e) => {
        if (editModal.classList.contains("open")) return;
        if (e.key === "ArrowLeft") {
          goToPage(currentPage - 1);
        } else if (e.key === "ArrowRight") {
          goToPage(currentPage + 1);
        } else if (e.code === "Space" && !playBtn.disabled && document.activeElement.tagName !== "BUTTON" && !document.activeElement.classList.contains("word-chip")) {
          e.preventDefault();
          toggleAudio();
        }
      });

      // Touch swipe support
      let touchStartX = 0;
      bookStage.addEventListener("touchstart", (e) => {
        touchStartX = e.changedTouches[0].screenX;
      }, { passive: true });

      bookStage.addEventListener("touchend", (e) => {
        const diff = e.changedTouches[0].screenX - touchStartX;
        if (Math.abs(diff) > 50) {
          if (diff < 0) goToPage(currentPage + 1);
          else goToPage(currentPage - 1);
        }
      }, { passive: true });

      // Korean toggle
      toggleKoBtn.addEventListener("click", () => {
        showKorean = !showKorean;
        renderPage();
      });

      // Sentence TTS
      ttsBtn.addEventListener("click", speakFullSentence);

      // Audio controls
      function toggleAudio() {
        if (audio.paused) {
          audio.play().catch(() => {});
        } else {
          audio.pause();
        }
      }

      playBtn.addEventListener("click", toggleAudio);

      replayBtn.addEventListener("click", () => {
        audio.currentTime = 0;
        audio.play().catch(() => {});
      });

      audio.addEventListener("play", () => {
        playBtn.textContent = "⏸ 일시정지";
      });

      audio.addEventListener("pause", () => {
        playBtn.textContent = "▶ 음성 듣기";
      });

      audio.addEventListener("ended", () => {
        playBtn.textContent = "▶ 다시 듣기";
      });

      audio.addEventListener("loadedmetadata", () => {
        timeLabel.textContent = `0:00 / ${formatTime(audio.duration)}`;
      });

      audio.addEventListener("timeupdate", () => {
        if (Number.isFinite(audio.duration) && audio.duration > 0) {
          seekBar.value = (audio.currentTime / audio.duration) * 100;
          timeLabel.textContent = `${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`;
        }
      });

      seekBar.addEventListener("input", () => {
        if (Number.isFinite(audio.duration) && audio.duration > 0) {
          audio.currentTime = (Number(seekBar.value) / 100) * audio.duration;
        }
      });

      speedBtns.forEach((btn) => {
        btn.addEventListener("click", () => {
          speedBtns.forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          currentRate = Number(btn.dataset.rate);
          audio.playbackRate = currentRate;
        });
      });

      // Manual folder picker fallback
      folderPicker.addEventListener("change", (e) => {
        const files = Array.from(e.target.files || []);
        if (!files.length) return;

        const findByBase = (base) =>
          files.find((f) => {
            const nameNoExt = f.name.replace(/\.[^/.]+$/, "").toLowerCase();
            return nameNoExt === base.toLowerCase();
          });

        const fPic1 = findByBase("picture_01");
        const fPic2 = findByBase("picture_02");
        const fSnd1 = findByBase("sound_01");

        applyAsset("picture_01", fPic1 ? { url: URL.createObjectURL(fPic1), filename: fPic1.name } : null);
        applyAsset("picture_02", fPic2 ? { url: URL.createObjectURL(fPic2), filename: fPic2.name } : null);
        applyAsset("sound_01", fSnd1 ? { url: URL.createObjectURL(fSnd1), filename: fSnd1.name } : null);

        statusHint.textContent = "선택한 폴더에서 파일을 불러왔습니다.";
        renderPage();
      });

      // Story Edit Modal
      editStoryBtn.addEventListener("click", () => {
        editEn1.value = pages[0].en;
        editKo1.value = pages[0].ko;
        editEn2.value = pages[1].en;
        editKo2.value = pages[1].ko;
        editModal.classList.add("open");
      });

      closeModalBtn.addEventListener("click", () => {
        editModal.classList.remove("open");
      });

      editModal.addEventListener("click", (e) => {
        if (e.target === editModal) editModal.classList.remove("open");
      });

      saveStoryBtn.addEventListener("click", () => {
        pages[0].en = editEn1.value.trim() || defaultPages[0].en;
        pages[0].ko = editKo1.value.trim() || defaultPages[0].ko;
        pages[1].en = editEn2.value.trim() || defaultPages[1].en;
        pages[1].ko = editKo2.value.trim() || defaultPages[1].ko;
        saveStory();
        renderPage();
        editModal.classList.remove("open");
      });

      // Init
      renderPage();
      autoDiscoverAssets();
    })();
  </script>
</body>
</html>
